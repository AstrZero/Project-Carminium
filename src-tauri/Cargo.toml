[package]
name = "carminium"
version = "1.2.240"
description = "Project Carminium — Material You Music Player for iOS (Tauri v2)"
authors = ["Seirai Haraguchi", "AstrZero"]
edition = "2021"

[lib]
name = "carminium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-carminium-audio = { path = "plugins/tauri-plugin-carminium-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
md5 = "0.7"
base64 = "0.22"
urlencoding = "2"
quick-xml = "0.37"
walkdir = "2"
flate2 = "1"
rand = "0.8"
log = "0.4"
