[package]
name = "tauri-plugin-carminium-audio"
description = "iOS AVPlayer, AVAudioSession, MPNowPlayingInfoCenter, MPRemoteCommandCenter, AirPlay, and document picker plugin for Project Carminium"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-carminium-audio"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
tokio = { version = "1", features = ["sync"] }
log = "0.4"
thiserror = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", features = ["wry"] }
